name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          BASE=$(grep '^archives_base_name=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"       >> "$GITHUB_OUTPUT"

      - name: Build jar + loader
        id: gradle
        run: |
          set -o pipefail
          ./gradlew.bat --no-daemon --stacktrace --info build :havoc-loader:build 2>&1 | tee gradle.log

      - name: Stage payload + loader + compute sha256
        id: payload
        run: |
          set -euo pipefail
          VERSION="${{ steps.props.outputs.version }}"
          BASE="${{ steps.props.outputs.base }}"
          CLIENT_JAR="build/libs/${BASE}-${VERSION}.jar"
          LOADER_JAR="havoc-loader/build/libs/havoc-loader-${VERSION}.jar"

          if [ ! -f "$CLIENT_JAR" ]; then
            echo "::error::missing $CLIENT_JAR"; ls -la build/libs/; exit 1
          fi
          if [ ! -f "$LOADER_JAR" ]; then
            echo "::error::missing $LOADER_JAR"; ls -la havoc-loader/build/libs/; exit 1
          fi

          mkdir -p release-stage
          # The payload is the client jar renamed to a FIXED filename. The loader expects
          # exactly this name under .minecraft/mods/.
          cp "$CLIENT_JAR" release-stage/havoc-payload.jar
          cp "$LOADER_JAR" "release-stage/havoc-loader-${VERSION}.jar"

          SHA=$(sha256sum release-stage/havoc-payload.jar | cut -d' ' -f1)
          echo "payload sha256: $SHA"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "loader_jar=release-stage/havoc-loader-${VERSION}.jar" >> "$GITHUB_OUTPUT"
          echo "payload_jar=release-stage/havoc-payload.jar"           >> "$GITHUB_OUTPUT"
          ls -lh release-stage/

      - name: Update docs/latest.json for GitHub Pages manifest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.props.outputs.version }}"
          SHA="${{ steps.payload.outputs.sha256 }}"
          mkdir -p docs
          cat > docs/latest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/havoc-payload.jar",
            "sha256": "${SHA}",
            "notes": "Build ${GITHUB_SHA:0:7}"
          }
          EOF
          cat docs/latest.json

          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add docs/latest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged — nothing to commit"
          else
            git commit -m "ci: update update-manifest to ${VERSION} (${GITHUB_SHA:0:7}) [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "retry push ($i)"; sleep 2
            done
          fi

      - name: Obfuscate jar (ProGuard standalone)
        id: obf
        continue-on-error: true
        env:
          PROGUARD_VERSION: "7.6.1"
          PROGUARD_CORE_VERSION: "9.1.10"
          LOG4J_VERSION: "2.24.3"
          GSON_VERSION: "2.11.0"
        run: |
          set -o pipefail
          VERSION="${{ steps.props.outputs.version }}"
          BASE="${{ steps.props.outputs.base }}"
          CLEAN="build/libs/${BASE}-${VERSION}.jar"
          OBF="build/libs/${BASE}-${VERSION}-obf.jar"
          if [ ! -f "$CLEAN" ]; then
            echo "Clean jar missing; cannot obfuscate."; exit 1
          fi

          # Download ProGuard + its runtime deps from Maven Central
          mkdir -p .proguard
          dl() {
            local url="$1" dest="$2"
            [ -f "$dest" ] && return 0
            echo "fetch $url"
            curl -sSLf -o "$dest" "$url"
          }
          GS="https://repo1.maven.org/maven2/com/guardsquare"
          L4="https://repo1.maven.org/maven2/org/apache/logging/log4j"
          GS2="https://repo1.maven.org/maven2/com/google/code/gson"
          dl "${GS}/proguard-base/${PROGUARD_VERSION}/proguard-base-${PROGUARD_VERSION}.jar"       ".proguard/proguard-base.jar"
          dl "${GS}/proguard-core/${PROGUARD_CORE_VERSION}/proguard-core-${PROGUARD_CORE_VERSION}.jar" ".proguard/proguard-core.jar"
          dl "${L4}/log4j-api/${LOG4J_VERSION}/log4j-api-${LOG4J_VERSION}.jar"                     ".proguard/log4j-api.jar"
          dl "${L4}/log4j-core/${LOG4J_VERSION}/log4j-core-${LOG4J_VERSION}.jar"                   ".proguard/log4j-core.jar"
          dl "${GS2}/gson/${GSON_VERSION}/gson-${GSON_VERSION}.jar"                                ".proguard/gson.jar"
          ls -lh .proguard/

          # Dump runtime classpath via a committed init script
          ./gradlew.bat --no-daemon --init-script .ci/print-runtime-classpath.gradle -q printRuntimeClasspath \
              > cp.raw 2>&1 || true
          grep '^CP::' cp.raw | sed 's/^CP:://' > cp.txt
          echo "Resolved $(wc -l < cp.txt) runtime jars for -libraryjars"

          # Build libraryjars list (as a response file to avoid Windows command-line length limits)
          : > pg.libs
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ ! -e "$p" ] && continue
            # Convert to native path for ProGuard
            NATIVE="$(cygpath -w "$p" 2>/dev/null || echo "$p")"
            printf -- '-libraryjars "%s"\n' "$NATIVE" >> pg.libs
          done < cp.txt

          # JDK jmods
          JAVA_HOME_U="$(cygpath -u "$JAVA_HOME" 2>/dev/null || echo "$JAVA_HOME")"
          for m in java.base java.desktop java.sql java.naming java.management java.logging java.net.http java.scripting java.xml jdk.unsupported jdk.jfr; do
            JMOD_U="${JAVA_HOME_U}/jmods/${m}.jmod"
            if [ -f "$JMOD_U" ]; then
              JMOD_W="$(cygpath -w "$JMOD_U" 2>/dev/null || echo "$JMOD_U")"
              printf -- '-libraryjars "%s"(!**.jar;!module-info.class)\n' "$JMOD_W" >> pg.libs
            fi
          done
          echo "libraryjars entries: $(wc -l < pg.libs)"

          # Classpath separator on Windows is ';'
          PG_CP=".proguard/proguard-base.jar;.proguard/proguard-core.jar;.proguard/log4j-api.jar;.proguard/log4j-core.jar;.proguard/gson.jar"

          java -cp "$PG_CP" proguard.ProGuard \
              @proguard.pro \
              @pg.libs \
              -injars  "$CLEAN" \
              -outjars "$OBF" 2>&1 | tee -a gradle.log

          echo "=== build/libs after obfuscation ==="
          ls -lh build/libs/

      - name: List build output
        if: always()
        run: ls -lh build/libs || true

      - name: Tail gradle log on failure
        if: failure()
        run: |
          echo "=== gradle.log (tail 400) ==="
          tail -n 400 gradle.log || true

      - name: Prepare gradle log for release attachment
        if: always()
        continue-on-error: true
        run: |
          if [ -f gradle.log ]; then
            tail -n 3000 gradle.log > "gradle-${GITHUB_RUN_ID}.log"
            ls -lh "gradle-${GITHUB_RUN_ID}.log"
          fi

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}
          path: |
            build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Attach jars + gradle log to 'latest' release
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="latest"
          VERSION="${{ steps.props.outputs.version }}"
          BASE="${{ steps.props.outputs.base }}"
          CLEAN="build/libs/${BASE}-${VERSION}.jar"
          OBF="build/libs/${BASE}-${VERSION}-obf.jar"
          PAYLOAD="release-stage/havoc-payload.jar"
          LOADER="release-stage/havoc-loader-${VERSION}.jar"
          LOG="gradle-${GITHUB_RUN_ID}.log"

          if [ ! -f "$CLEAN" ]; then
            echo "No clean jar at $CLEAN — nothing to release"
            ls -la build/libs/ || true
            exit 0
          fi

          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true

          # The payload asset MUST be named 'havoc-payload.jar' — the loader downloads it
          # by that exact filename from the latest release.
          ASSETS=("$PAYLOAD" "$LOADER" "$CLEAN")
          [ -f "$OBF" ] && ASSETS+=("$OBF")
          [ -f "$LOG" ] && ASSETS+=("$LOG")

          cat > release-notes.md <<RELEASE_NOTES_EOF
          Build from commit ${GITHUB_SHA:0:7}.

          **Install (new users):**
          Drop BOTH into \`.minecraft/mods/\`:
          - \`havoc-loader-${VERSION}.jar\` — the self-updater; install once, forever
          - \`havoc-payload.jar\` — the actual client; the loader keeps this up to date

          **Already have the loader?** You don't need to download anything — your loader will fetch the new payload on the next Minecraft launch and swap it in on the launch after that.

          **Legacy single-jar install:** \`${BASE}-${VERSION}.jar\` is here for anyone not using the loader (and the ProGuard-obfuscated variant if the obf step succeeded).
          RELEASE_NOTES_EOF

          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Havoc Client ${VERSION} (latest)" \
            --notes-file release-notes.md
