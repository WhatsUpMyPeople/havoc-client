name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          BASE=$(grep '^archives_base_name=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"       >> "$GITHUB_OUTPUT"

      - name: Build jar + loader
        id: gradle
        run: |
          set -o pipefail
          ./gradlew.bat --no-daemon --stacktrace --info build loaderJar 2>&1 | tee gradle.log

      - name: Obfuscate jar (Skidfuscator)
        id: obf
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          VERSION="${{ steps.props.outputs.version }}"
          BASE="${{ steps.props.outputs.base }}"
          CLEAN="build/libs/${BASE}-${VERSION}.jar"
          OBF="build/libs/${BASE}-${VERSION}-obf.jar"
          if [ ! -f "$CLEAN" ]; then
            echo "Clean jar missing; cannot obfuscate."; exit 1
          fi

          # ---- Fetch latest Skidfuscator release ----
          mkdir -p .skid
          REL_JSON=$(curl -sSLf \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/terminalsin/skidfuscator-java-obfuscator/releases/latest")
          echo "$REL_JSON" | head -c 2000; echo
          SKID_TAG=$(echo "$REL_JSON" | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          # Prefer a jar whose name contains "cli" (CLI entrypoint); fall back to first .jar
          SKID_URL=$(echo "$REL_JSON" | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assets = [a for a in d['assets'] if a['name'].endswith('.jar')]
          if not assets:
              sys.exit('no jar assets in release')
          cli = [a for a in assets if 'cli' in a['name'].lower()]
          print((cli or assets)[0]['browser_download_url'])
          ")
          echo "Skidfuscator ${SKID_TAG}: ${SKID_URL}"
          curl -sSLf -o .skid/skidfuscator.jar "$SKID_URL"
          ls -lh .skid/

          # ---- Resolve runtime libs via Gradle init script ----
          ./gradlew.bat --no-daemon --init-script .ci/print-runtime-classpath.gradle -q printRuntimeClasspath \
              > cp.raw 2>&1 || true
          grep '^CP::' cp.raw | sed 's/^CP:://' > cp.txt
          mkdir -p .skid/libs
          # Skidfuscator reads .jar files from the libs dir. Only copy jars; skip .jmod
          # since Skidfuscator passes those through its runtime arg separately.
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ ! -e "$p" ] && continue
            case "$p" in
              *.jar) cp "$p" ".skid/libs/$(basename "$p")" 2>/dev/null || true ;;
            esac
          done < cp.txt
          echo "lib jars staged: $(ls .skid/libs 2>/dev/null | wc -l)"

          # ---- Pick the Java runtime jar Skidfuscator needs for class resolution ----
          # Skidfuscator wants a single runtime jar (classic rt.jar replacement). On
          # Java 9+ the equivalent is jrt-fs.jar from the JDK or any jmod expanded to
          # a jar. Simplest: convert java.base.jmod to a jar on the fly.
          JAVA_HOME_U="$(cygpath -u "$JAVA_HOME" 2>/dev/null || echo "$JAVA_HOME")"
          JMOD_BASE="${JAVA_HOME_U}/jmods/java.base.jmod"
          RT_JAR=".skid/runtime.jar"
          if [ -f "$JMOD_BASE" ]; then
            # jmod extract puts classes/ in a dir; jar them up as a plain jar
            mkdir -p .skid/rt-extract
            (cd .skid/rt-extract && "${JAVA_HOME_U}/bin/jmod" extract "$JMOD_BASE") || true
            if [ -d .skid/rt-extract/classes ]; then
              (cd .skid/rt-extract/classes && "${JAVA_HOME_U}/bin/jar" cf "../../$(basename "$RT_JAR")" .) || true
            fi
          fi
          # Fallback: pass jrt-fs.jar if the extract failed
          if [ ! -f "$RT_JAR" ] && [ -f "${JAVA_HOME_U}/lib/jrt-fs.jar" ]; then
            cp "${JAVA_HOME_U}/lib/jrt-fs.jar" "$RT_JAR"
          fi
          [ -f "$RT_JAR" ] && echo "runtime jar: $(ls -lh "$RT_JAR" | awk '{print $5}')" \
                           || echo "no runtime jar prepared"

          # ---- Run Skidfuscator with the real CLI (from --help): ----
          # obfuscate [-hV] [-dbg] [-fuckit] [-notrack] [-ph] [-cfg=<config>]
          #           [-ex=<exempt>] [-li=<libFolder>] [-o=<output>]
          #           [-rt=<runtime>] <input>
          echo ""
          echo "=== Skidfuscator CLI ==="
          echo "cmd: java -jar .skid/skidfuscator.jar obfuscate -notrack -cfg=skidfuscator.yml -ex=skidfuscator-exempts.yml -li=.skid/libs -o=$OBF -rt=$RT_JAR $CLEAN"
          if [ -f "$RT_JAR" ]; then
            java -jar .skid/skidfuscator.jar obfuscate -notrack \
                 -cfg=skidfuscator.yml \
                 -ex=skidfuscator-exempts.yml \
                 -li=.skid/libs \
                 -o="$OBF" \
                 -rt="$RT_JAR" \
                 "$CLEAN" 2>&1 | tee -a gradle.log
          else
            java -jar .skid/skidfuscator.jar obfuscate -notrack \
                 -cfg=skidfuscator.yml \
                 -ex=skidfuscator-exempts.yml \
                 -li=.skid/libs \
                 -o="$OBF" \
                 "$CLEAN" 2>&1 | tee -a gradle.log
          fi || true

          echo "=== build/libs after obfuscation ==="
          ls -lh build/libs/ || true
          if [ -f "$OBF" ]; then
            echo "::notice::obfuscated jar built: $OBF ($(stat -c%s "$OBF") bytes)"
          else
            echo "::warning::no obfuscated jar produced — release will fall back to clean payload"
          fi

      - name: Stage payload + loader, compute sha256, update docs/latest.json
        id: payload
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.props.outputs.version }}"
          BASE="${{ steps.props.outputs.base }}"
          CLEAN_JAR="build/libs/${BASE}-${VERSION}.jar"
          OBF_JAR="build/libs/${BASE}-${VERSION}-obf.jar"
          LOADER_JAR="build/libs/havoc-loader-${VERSION}.jar"

          if [ ! -f "$CLEAN_JAR" ]; then
            echo "::error::missing $CLEAN_JAR"; ls -la build/libs/; exit 1
          fi
          if [ ! -f "$LOADER_JAR" ]; then
            echo "::error::missing $LOADER_JAR"; ls -la build/libs/; exit 1
          fi

          # Prefer the obfuscated jar as the distributed payload. Fall back to the clean
          # jar if the obf step didn't produce one (continue-on-error on that step keeps
          # releases shipping even when the obf config needs tweaking).
          if [ -f "$OBF_JAR" ]; then
            PAYLOAD_SRC="$OBF_JAR"
            PAYLOAD_FLAVOR="obfuscated"
          else
            PAYLOAD_SRC="$CLEAN_JAR"
            PAYLOAD_FLAVOR="clean (obfuscation step skipped or failed)"
          fi
          echo "Payload source: ${PAYLOAD_SRC} (${PAYLOAD_FLAVOR})"

          mkdir -p release-stage
          cp "$PAYLOAD_SRC" release-stage/havoc-payload.jar
          cp "$LOADER_JAR"  "release-stage/havoc-loader-${VERSION}.jar"
          SHA=$(sha256sum release-stage/havoc-payload.jar | cut -d' ' -f1)
          echo "payload sha256: $SHA"
          echo "sha256=$SHA"           >> "$GITHUB_OUTPUT"
          echo "flavor=$PAYLOAD_FLAVOR" >> "$GITHUB_OUTPUT"
          ls -lh release-stage/

          # Only commit the manifest from the main branch so feature branches don't
          # overwrite the public update channel.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            mkdir -p docs
            cat > docs/latest.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/havoc-payload.jar",
            "sha256": "${SHA}",
            "notes": "Build ${GITHUB_SHA:0:7}"
          }
          EOF
            cat docs/latest.json
            git config user.email "actions@github.com"
            git config user.name  "github-actions[bot]"
            git add docs/latest.json
            if git diff --cached --quiet; then
              echo "manifest unchanged"
            else
              git commit -m "ci: update update-manifest to ${VERSION} (${GITHUB_SHA:0:7}) [skip ci]"
              for i in 1 2 3; do
                git pull --rebase origin main && git push origin HEAD:main && break
                echo "retry push ($i)"; sleep 2
              done
            fi
          fi

      - name: List build output
        if: always()
        run: ls -lh build/libs || true

      - name: Tail gradle log on failure
        if: failure()
        run: |
          echo "=== gradle.log (tail 400) ==="
          tail -n 400 gradle.log || true

      - name: Prepare gradle log for release attachment
        if: always()
        continue-on-error: true
        run: |
          if [ -f gradle.log ]; then
            tail -n 3000 gradle.log > "gradle-${GITHUB_RUN_ID}.log"
            ls -lh "gradle-${GITHUB_RUN_ID}.log"
          fi

      - name: Push gradle log into repo on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ ! -f "gradle-${GITHUB_RUN_ID}.log" ]; then
            echo "no log to push"; exit 0
          fi
          mkdir -p _ci
          cp "gradle-${GITHUB_RUN_ID}.log" "_ci/gradle-${GITHUB_RUN_ID}.log"
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git add "_ci/gradle-${GITHUB_RUN_ID}.log"
          if ! git diff --cached --quiet; then
            git commit -m "ci: log for failed run ${GITHUB_RUN_ID} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "retry push ($i)"; sleep 2
            done
          fi

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}
          path: |
            build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Attach jars + gradle log to 'latest' release
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="latest"
          VERSION="${{ steps.props.outputs.version }}"
          BASE="${{ steps.props.outputs.base }}"
          CLEAN="build/libs/${BASE}-${VERSION}.jar"
          OBF="build/libs/${BASE}-${VERSION}-obf.jar"
          PAYLOAD="release-stage/havoc-payload.jar"
          LOADER="release-stage/havoc-loader-${VERSION}.jar"
          LOG="gradle-${GITHUB_RUN_ID}.log"

          if [ ! -f "$CLEAN" ]; then
            echo "No clean jar at $CLEAN — nothing to release"
            ls -la build/libs/ || true
            exit 0
          fi

          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true

          # The payload asset MUST be named 'havoc-payload.jar' — the loader downloads it
          # by that exact filename from the latest release.
          ASSETS=("$CLEAN")
          [ -f "$PAYLOAD" ] && ASSETS+=("$PAYLOAD")
          [ -f "$LOADER" ]  && ASSETS+=("$LOADER")
          [ -f "$OBF" ]     && ASSETS+=("$OBF")
          [ -f "$LOG" ]     && ASSETS+=("$LOG")

          cat > release-notes.md <<RELEASE_NOTES_EOF
          Build from commit ${GITHUB_SHA:0:7}.

          New installs (recommended): drop havoc-loader-${VERSION}.jar and havoc-payload.jar into .minecraft/mods/. The loader self-updates the payload on every launch.

          Already have the loader: do nothing. Your loader fetches the new payload on the next Minecraft launch and swaps it in on the launch after that.

          Legacy single-jar install: ${BASE}-${VERSION}.jar is here for anyone not using the loader (plus the ProGuard-obfuscated variant if that step succeeded).
          RELEASE_NOTES_EOF

          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Havoc Client ${VERSION} (latest)" \
            --notes-file release-notes.md
