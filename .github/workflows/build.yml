name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          BASE=$(grep '^archives_base_name=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"       >> "$GITHUB_OUTPUT"

      - name: Build jar
        id: gradle
        run: |
          set -o pipefail
          ./gradlew.bat --no-daemon --stacktrace --info build 2>&1 | tee gradle.log

      - name: Obfuscate jar (ProGuard)
        id: obf
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew.bat --no-daemon --stacktrace --info obfuscateJar 2>&1 | tee -a gradle.log
          ls -lh build/libs/

      - name: List build output
        if: always()
        run: ls -lh build/libs || true

      - name: Tail gradle log on failure
        if: failure()
        run: |
          echo "=== gradle.log (tail 400) ==="
          tail -n 400 gradle.log || true

      - name: Push gradle log into repo (readable via Contents API)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ ! -f gradle.log ]; then
            echo "no gradle.log to push"
            exit 0
          fi
          tail -n 2000 gradle.log > gradle.tail.log
          # base64: Windows coreutils doesn't accept -w0; the file is a single stream, so plain base64 and tr suffices.
          B64=$(base64 gradle.tail.log | tr -d '\r\n')
          RUN="${GITHUB_RUN_ID}"
          PATH_IN_REPO="_ci/gradle-${RUN}.log"
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" --jq .sha 2>/dev/null || true)
          BODY=$(jq -nc --arg msg "ci: log for run ${RUN}" --arg c "$B64" --arg s "${SHA:-}" \
            '{message:$msg, content:$c} + (if $s != "" then {sha:$s} else {} end)')
          echo "$BODY" | gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" --input - >/dev/null
          echo "pushed ${PATH_IN_REPO}"

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}
          path: |
            build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Attach jars to 'latest' release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="latest"
          CLEAN="build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}.jar"
          OBF="build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}-obf.jar"
          if [ ! -f "$CLEAN" ]; then
            echo "No artifact at $CLEAN"; ls -la build/libs/; exit 1
          fi
          # Delete the tag and release if they exist so the new jars replace cleanly
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          # Create new release pointing at the current commit
          ASSETS=("$CLEAN")
          if [ -f "$OBF" ]; then
            ASSETS+=("$OBF")
            NOTES="Automatically published build from commit ${GITHUB_SHA:0:7}. Clean + ProGuard-obfuscated jars."
          else
            NOTES="Automatically published build from commit ${GITHUB_SHA:0:7}. Obfuscation step skipped or failed."
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.props.outputs.name }} ${{ steps.props.outputs.version }} (latest)" \
            --notes "$NOTES"
