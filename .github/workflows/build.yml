name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Read mod version
        id: props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          BASE=$(grep '^archives_base_name=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "base=$BASE"             >> "$GITHUB_OUTPUT"

      - name: Build jar
        id: gradle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --info build 2>&1 | tee gradle.log

      - name: List build output
        if: always()
        run: ls -lh build/libs || true

      - name: Tail gradle log on failure
        if: failure()
        run: |
          echo "=== gradle.log (tail 400) ==="
          tail -n 400 gradle.log || true

      - name: Upload gradle log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}
          path: |
            build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
