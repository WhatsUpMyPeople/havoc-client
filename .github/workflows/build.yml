name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: props
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          BASE=$(grep '^archives_base_name=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"       >> "$GITHUB_OUTPUT"

      - name: Build jar
        id: gradle
        run: |
          set -o pipefail
          ./gradlew.bat --no-daemon --stacktrace --info build 2>&1 | tee gradle.log

      - name: Obfuscate jar (ProGuard standalone)
        id: obf
        continue-on-error: true
        env:
          PROGUARD_VERSION: "7.6.1"
          PROGUARD_CORE_VERSION: "9.1.10"
        run: |
          set -o pipefail
          VERSION="${{ steps.props.outputs.version }}"
          BASE="${{ steps.props.outputs.base }}"
          CLEAN="build/libs/${BASE}-${VERSION}.jar"
          OBF="build/libs/${BASE}-${VERSION}-obf.jar"
          if [ ! -f "$CLEAN" ]; then
            echo "Clean jar missing; cannot obfuscate."; exit 1
          fi

          # Download ProGuard CLI jars from Maven Central
          mkdir -p .proguard
          BASEURL="https://repo1.maven.org/maven2/com/guardsquare"
          curl -sSLf -o ".proguard/proguard-base-${PROGUARD_VERSION}.jar"      "${BASEURL}/proguard-base/${PROGUARD_VERSION}/proguard-base-${PROGUARD_VERSION}.jar"
          curl -sSLf -o ".proguard/proguard-core-${PROGUARD_CORE_VERSION}.jar" "${BASEURL}/proguard-core/${PROGUARD_CORE_VERSION}/proguard-core-${PROGUARD_CORE_VERSION}.jar"

          # Dump runtime classpath via a committed init script
          ./gradlew.bat --no-daemon --init-script .ci/print-runtime-classpath.gradle -q printRuntimeClasspath \
              > cp.raw 2>&1 || true
          grep '^CP::' cp.raw | sed 's/^CP:://' > cp.txt
          echo "Resolved $(wc -l < cp.txt) runtime jars for -libraryjars"

          # Build libraryjars list (as a response file to avoid Windows command-line length limits)
          : > pg.libs
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ ! -e "$p" ] && continue
            # Convert to native path for ProGuard
            NATIVE="$(cygpath -w "$p" 2>/dev/null || echo "$p")"
            printf -- '-libraryjars "%s"\n' "$NATIVE" >> pg.libs
          done < cp.txt

          # JDK jmods
          JAVA_HOME_U="$(cygpath -u "$JAVA_HOME" 2>/dev/null || echo "$JAVA_HOME")"
          for m in java.base java.desktop java.sql java.naming java.management java.logging java.net.http java.scripting java.xml jdk.unsupported jdk.jfr; do
            JMOD_U="${JAVA_HOME_U}/jmods/${m}.jmod"
            if [ -f "$JMOD_U" ]; then
              JMOD_W="$(cygpath -w "$JMOD_U" 2>/dev/null || echo "$JMOD_U")"
              printf -- '-libraryjars "%s"(!**.jar;!module-info.class)\n' "$JMOD_W" >> pg.libs
            fi
          done
          echo "libraryjars entries: $(wc -l < pg.libs)"

          # Classpath separator on Windows is ';'
          PG_CP=".proguard/proguard-base-${PROGUARD_VERSION}.jar;.proguard/proguard-core-${PROGUARD_CORE_VERSION}.jar"

          java -cp "$PG_CP" proguard.ProGuard \
              @proguard.pro \
              @pg.libs \
              -injars  "$CLEAN" \
              -outjars "$OBF" 2>&1 | tee -a gradle.log

          echo "=== build/libs after obfuscation ==="
          ls -lh build/libs/

      - name: List build output
        if: always()
        run: ls -lh build/libs || true

      - name: Tail gradle log on failure
        if: failure()
        run: |
          echo "=== gradle.log (tail 400) ==="
          tail -n 400 gradle.log || true

      - name: Prepare gradle log for release attachment
        if: always()
        continue-on-error: true
        run: |
          if [ -f gradle.log ]; then
            tail -n 3000 gradle.log > "gradle-${GITHUB_RUN_ID}.log"
            ls -lh "gradle-${GITHUB_RUN_ID}.log"
          fi

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}
          path: |
            build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}.jar
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Attach jars + gradle log to 'latest' release
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="latest"
          CLEAN="build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}.jar"
          OBF="build/libs/${{ steps.props.outputs.base }}-${{ steps.props.outputs.version }}-obf.jar"
          LOG="gradle-${GITHUB_RUN_ID}.log"
          if [ ! -f "$CLEAN" ]; then
            echo "No clean jar at $CLEAN — nothing to release"
            ls -la build/libs/ || true
            exit 0
          fi
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          ASSETS=("$CLEAN")
          [ -f "$OBF" ] && ASSETS+=("$OBF")
          [ -f "$LOG" ] && ASSETS+=("$LOG")
          STATE="clean"
          [ -f "$OBF" ] && STATE="clean + ProGuard-obfuscated"
          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.props.outputs.name }} ${{ steps.props.outputs.version }} (latest)" \
            --notes "Build from commit ${GITHUB_SHA:0:7}. Includes ${STATE} jar(s) and the gradle log for this run."
