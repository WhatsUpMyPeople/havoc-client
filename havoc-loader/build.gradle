// Havoc loader subproject.
//
// Produces a tiny Fabric mod jar (~50 KB) that lives in the user's mods folder
// forever and self-updates the main `havoc-payload.jar` from the update server.
//
// Build with:  ./gradlew :havoc-loader:build
// Output:      havoc-loader/build/libs/havoc-loader-<version>.jar

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

base {
    archivesName = 'havoc-loader'
}
version = rootProject.providers.gradleProperty('mod_version').get()
group   = rootProject.providers.gradleProperty('maven_group').get()

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings  loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version':            project.version,
               'minecraft_version':   rootProject.minecraft_version,
               'loader_version':      rootProject.loader_version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes 'Multi-Release': 'true'
    }
}
