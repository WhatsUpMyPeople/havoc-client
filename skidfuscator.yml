# Skidfuscator CE 2.0.x config for Havoc Client.
#
# This file configures ONLY which transformers run and their settings.
# Keep rules (what classes/methods to leave alone) live in
# skidfuscator-exempts.yml and are passed via the -ex flag.
#
# Reference: https://github.com/terminalsin/skidfuscator-java-obfuscator

# Rename everything the exempt file doesn't protect.
renamer:
  enabled: true
  # Preserve stack trace file info for crash reports.
  keep-line-numbers: true

# Flatten control flow — the main anti-decompile pass. Hot on CPU but worth it.
flow:
  enabled: true

# Encrypt string literals so secrets, URLs, paths don't appear in strings view.
string-encryption:
  enabled: true

# Scramble integer and long constants.
number-encryption:
  enabled: true

# Dead-code / unused-class trimming. OFF — too easy to drop something reached
# only via reflection (addon API consumers, config profile loaders).
trimming:
  enabled: false

# Anti-tamper + anti-debug both collide with Fabric's class transformation
# and Minecraft's crash reporter. Leave off.
anti-tamper:
  enabled: false

anti-debug:
  enabled: false

# Watermark the jar so leaked copies are traceable to the build commit.
watermark:
  enabled: true
  text: "Havoc Client — built ${GITHUB_SHA} — see github.com/WhatsUpMyPeople/havoc-client"
