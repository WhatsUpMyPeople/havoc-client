// Havoc Client — ProGuard pass
//
// Produces build/libs/<base>-<version>-obf.jar by running ProGuard on the
// Loom-remapped jar (Minecraft refs are already intermediary at that point).
// The input is the output of `remapJar`; library jars come from the mod's
// runtime classpath plus the JDK.
//
// Invoke: ./gradlew obfuscateJar
//         (or `build obfuscateJar` to get both the clean and obfuscated jars)

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.6.1'
    }
}

def cleanRemapJarTask = tasks.named("remapJar")

def obfuscatedJarFile = layout.buildDirectory
        .file("libs/${archivesBaseName}-${project.version}-obf.jar")

tasks.register('obfuscateJar', proguard.gradle.ProGuardTask) {
    group = "build"
    description = "Runs ProGuard on the Loom-remapped jar."
    dependsOn cleanRemapJarTask

    def inputJar = cleanRemapJarTask.flatMap { it.archiveFile }
    inputs.file(inputJar)
    inputs.file(rootProject.file("proguard.pro"))
    outputs.file(obfuscatedJarFile)

    injars inputJar
    outjars obfuscatedJarFile

    // JDK's core modules — ProGuard needs these as libraryjars
    def jmods = "${System.getProperty('java.home')}/jmods"
    libraryjars(
            files(
                    "${jmods}/java.base.jmod",
                    "${jmods}/java.desktop.jmod",
                    "${jmods}/java.sql.jmod",
                    "${jmods}/java.naming.jmod",
                    "${jmods}/java.management.jmod",
                    "${jmods}/java.logging.jmod",
                    "${jmods}/java.net.http.jmod",
                    "${jmods}/java.scripting.jmod",
                    "${jmods}/java.xml.jmod",
                    "${jmods}/jdk.unsupported.jmod",
                    "${jmods}/jdk.jfr.jmod"
            ),
            jarfilter: '!**.jar',
            filter: '!module-info.class'
    )

    // Everything on the runtime classpath (Minecraft, Fabric, Mixin, Lombok, etc.)
    libraryjars sourceSets.main.runtimeClasspath

    configuration rootProject.file("proguard.pro")

    doFirst {
        logger.lifecycle("ProGuard input:  ${inputJar.get().asFile}")
        logger.lifecycle("ProGuard output: ${obfuscatedJarFile.get().asFile}")
    }
}

// Make 'build' also produce the obfuscated jar when invoked explicitly.
// (We do NOT make `build` depend on it by default — the clean remapJar remains
// the primary artifact; obfuscation is opt-in via the `obfuscateJar` task.)
